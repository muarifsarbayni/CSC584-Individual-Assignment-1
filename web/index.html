<!DOCTYPE html>
<html>
    <head>
        <title>Personal Profile Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h2>Personal Profile Form</h2>
            <form action="ProfileServlet" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="studentId">Student ID:</label>
                <input type="text" id="studentId" name="studentId" required>

                <label for="programme">Programme:</label>
                <input type="text" id="programme" name="programme" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="hobbies">Hobbies:</label>
                <input type="text" id="hobbies" name="hobbies" required>

                <label for="selfIntroduction">Short Self-Introduction:</label>
                <textarea id="selfIntroduction" name="selfIntroduction" rows="4" required></textarea>

                <input type="submit" value="Submit Profile">
            </form>
        </div>
    </body>
</html>
